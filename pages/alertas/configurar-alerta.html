    <main class="contenido-principal">
        <header class="encabezado-pagina">
            <div class="titulo-pagina">
                <h1>Configurar Alerta</h1>
                <p>Define las condiciones de tu notificación</p>
            </div>
            <div class="acciones-usuario">
                <button type="button" class="boton-notificacion">
                    <i class="ph ph-bell"></i>
                </button>
                <button type="button" class="boton-perfil">
                    <img src="" alt="Foto de perfil">
                </button>
            </div>
        </header>
        <section class="formulario-alerta">
            <div class="grupo-formulario">
                <label>Tipo de alerta</label>
                <div class="opciones-alerta">
                    <button type="button" class="tarjeta-opcion seleccionado">
                        <span class="icono-opcion"><i class="ph ph-credit-card"></i></span>
                        <span class="texto-opcion">Gasto</span>
                    </button>
                    <button type="button" class="tarjeta-opcion">
                        <span class="icono-opcion"><i class="ph ph-calendar"></i></span>
                        <span class="texto-opcion">Vencimiento</span>
                    </button>
                    <button type="button" class="tarjeta-opcion">
                        <span class="icono-opcion"><i class="ph ph-target"></i></span>
                        <span class="texto-opcion">Meta</span>
                    </button>
                    <button type="button" class="tarjeta-opcion">
                        <span class="icono-opcion"><i class="ph ph-pencil"></i></span>
                        <span class="texto-opcion">Personalizada</span>
                    </button>
                </div>
            </div>
            <div class="grupo-formulario">
                <label>Condición</label>
                <select class="campo-select">
                    <option>Superar el 80% del presupuesto</option>
                    <option>Superar el 50% del presupuesto</option>
                    <option>Alcanzar el límite de gasto</option>
                </select>
            </div>
            <div class="grupo-formulario">
                <label>Mensaje de la alerta</label>
                <textarea class="campo-textarea" rows="3" placeholder="Escribe el mensaje de la alerta...">Has alcanzado el 80% de tu presupuesto mensual en Alimentación</textarea>
            </div>
            <div class="grupo-formulario">
                <label class="alternancia-label">
                    <input type="checkbox" class="alternancia-checkbox" checked>
                    <span>Activar alerta inmediatamente</span>
                </label>
            </div>
        </section>
        <section class="acciones">
            <button type="button" class="boton-secundario">Cancelar</button>
            <button type="button" class="boton-primario">Guardar Alerta</button>
        </section>
    </main>  </body>
