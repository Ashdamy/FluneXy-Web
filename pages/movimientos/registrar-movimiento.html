    <main class="contenido-principal">
        <header class="encabezado-pagina">
            <div class="titulo-pagina">
                <h1>Nuevo Movimiento</h1>
                <p>Registra un ingreso o gasto</p>
            </div>
            <div class="acciones-usuario">
                <button type="button" class="boton-notificacion" onclick="location.href='../alertas/lista-alertas.html'">
                    <i class="ph ph-bell"></i>
                </button>
                <button type="button" class="boton-perfil" onclick="location.href='../usuario/mi-perfil.html'">A</button>
            </div>
        </header>
        <form class="formulario-movimiento" novalidate>
            <div class="grupo-formulario gap-tipo">
                <label>TIPO DE MOVIMIENTO</label>
                <div class="alternador-tipo">
                    <button type="button" class="opcion-alternador activo-ingreso"><i class="ph ph-arrow-up-right"></i> Ingreso</button>
                    <button type="button" class="opcion-alternador" onclick="location.href='nuevo-movimiento-gasto.html'"><i class="ph ph-arrow-down-left"></i> Gasto</button>
                </div>
            </div>
            <div class="fila-monto-fecha">
                <div class="grupo-formulario">
                    <label>MONTO</label>
                    <div class="campo-monto">
                        <span class="prefijo-monto">$</span>
                        <input type="text" placeholder="45.000">
                        <span class="badge-tipo badge-ingreso">Ingreso</span>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label>FECHA</label>
                    <div class="campo-fecha">
                        <input type="text" value="03 Jun 2025">
                        <span class="icono-calendario"><i class="ph ph-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="grupo-formulario gap-categorias">
                <label>CATEGORÍA</label>
                <div class="grid-categorias">
                    <button type="button" class="item-categoria activo"><i class="ph ph-briefcase"></i> Salario</button>
                    <button type="button" class="item-categoria"><i class="ph ph-trend-up"></i> Inversión</button>
                    <button type="button" class="item-categoria"><i class="ph ph-storefront"></i> Ventas</button>
                    <button type="button" class="item-categoria"><i class="ph ph-gift"></i> Bonificaciones</button>
                    <button type="button" class="item-categoria"><i class="ph ph-dots-three-circle"></i> Otros ingresos</button>
                </div>
            </div>
            <div class="grupo-formulario gap-fondo">
                <label>FONDO (MOD04)</label>
                <div class="grid-fondos">
                    <button type="button" class="item-fondo activo">
                        <i class="ph ph-device-mobile"></i>
                        <span class="info-fondo"><strong>Nequi</strong><span>$380.000</span></span>
                        <span class="check-fondo"><i class="ph ph-check"></i></span>
                    </button>
                    <button type="button" class="item-fondo">
                        <i class="ph ph-bank"></i>
                        <span class="info-fondo"><strong>Bancolombia</strong><span>$2.450.000</span></span>
                        <span class="check-fondo"><i class="ph ph-check"></i></span>
                    </button>
                    <button type="button" class="item-fondo">
                        <i class="ph ph-money"></i>
                        <span class="info-fondo"><strong>Efectivo</strong><span>$150.000</span></span>
                        <span class="check-fondo"><i class="ph ph-check"></i></span>
                    </button>
                </div>
            </div>
            <div class="grupo-formulario gap-descripcion">
                <label>DESCRIPCIÓN (opcional)</label>
                <textarea placeholder="Suscripción mensual Netflix plan Premium"></textarea>
            </div>
            <div class="acciones-movimiento">
                <button type="button" class="boton-secundario" onclick="location.href='mis-movimientos.html'">Cancelar</button>
                <button type="button" class="boton-primario" onclick="location.href='mis-movimientos.html'"><i class="ph ph-check"></i> Guardar Movimiento</button>
            </div>
        </form>
    </main>  </body>
