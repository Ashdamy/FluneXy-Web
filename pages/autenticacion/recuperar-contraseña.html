<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
    <main class="contenedor-autenticacion">
    <div class="volver">
        <a href="#">Volver</a>
    </div>
    <section class="tarjeta-formulario">
        <div class="icono-formulario">
            <img src="" alt="Icono de recuperación de contraseña">
        </div>
        <header class="encabezado-autenticacion">
            <h1>Recupera tu acceso</h1>
            <p>
                Ingresa tu correo y te enviaremos un enlace para
                restablecer tu contraseña.
            </p>
        </header>
        <form
            class="formulario-recuperacion-contrasena"
            action=""
            method="post">

            <div class="grupo-formulario">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required>
            </div>
            <button
                type="submit"
                class="boton-primario">
                Enviar enlace de recuperación
            </button>
            <div class="enlace-secundario">
                <a href="#">Volver al inicio de sesión</a>
            </div>
        </form>
    </section>
</main>  </body>
</html>
