<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="/assets/css/global.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body class="mod-auth">
    <!-- MÓDULO: Autenticación — S1 · Iniciar Sesión (Escritorio) -->
    <main class="contenedor-autenticacion">
        <section class="tarjeta-formulario">
            <div class="logo">
                <p>Fluye con tus finanzas</p>
                <img src="/media/img/logo-fluenxy.png" alt="Logo de FluneXy">
            </div>
            <header class="encabezado-autenticacion">
                <h1>Bienvenido de vuelta</h1>
                <p>
                    Ingresa tus datos para acceder a tu cuenta.
                </p>
            </header>
            <form
                class="formulario-inicio-sesion"
                action=""
                method="post">
                <div class="grupo-formulario">
                    <label for="correo">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="anamilena@ejemplo.com"
                        required>
                </div>
                <div class="grupo-formulario">
                    <label for="contrasena">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required>
                </div>
                <div class="recuperar-contrasena">
                    <a href="/pages/autenticacion/recuperar-contraseña.html">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <button
                    type="submit"
                    class="boton-primario"
                    onclick="event.preventDefault(); location.href='/pages/home-dashboard/home.html';">
                    Iniciar sesión
                </button>
                <p class="separador-social">
                    o continúa con
                </p>
                <div class="inicio-sesion-redes">
                    <button
                        type="button"
                        class="boton-social boton-google">
                        Continuar con Google
                    </button>
                    <button
                        type="button"
                        class="boton-social boton-apple">
                        Continuar con Apple
                    </button>
                </div>
            </form>
            <div class="enlace-secundario">
                <a href="/pages/autenticacion/registro.html">
                    ¿No tienes cuenta? Regístrate
                </a>
            </div>
        </section>
    </main>
</body>
</html>
