<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/assets/css/global.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body class="mod-auth">
    <!-- MÓDULO: Autenticación — S3 · Registro (Escritorio) -->
    <main class="contenedor-autenticacion">
        <div class="volver">
            <a href="/pages/autenticacion/iniciar-sesion.html"><i class="ph ph-arrow-left"></i> Volver</a>
        </div>
        <section class="tarjeta-formulario">
            <header class="encabezado-autenticacion">
                <h1>Crea tu cuenta</h1>
                <p>Empieza gratis. Sin tarjeta de crédito.</p>
            </header>
            <form class="formulario-registro" action="" method="post">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ana Milena"
                        required>
                </div>
                <div class="grupo-formulario">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="anamilena@ejemplo.com"
                        required>
                    <p class="mensaje-ayuda">
                        Usaremos este correo para verificar tu cuenta.
                    </p>
                </div>
                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required>
                    <div class="barra-fortaleza">
                        <div class="nivel-fortaleza"></div>
                        <div class="nivel-fortaleza"></div>
                        <div class="nivel-fortaleza"></div>
                        <div class="nivel-fortaleza"></div>
                    </div>
                    <p class="mensaje-fortaleza">
                        Fortaleza: media — añade símbolos para mejorarla.
                    </p>
                </div>
                <div class="grupo-formulario">
                    <label for="confirmar-contrasena">
                        Confirmar contraseña
                    </label>
                    <input
                        type="password"
                        id="confirmar-contrasena"
                        name="confirmar-contrasena"
                        required>
                </div>
                <button
                    type="submit"
                    class="boton-primario"
                    onclick="event.preventDefault(); location.href='verificacion-contraseña.html';">
                    Crear cuenta gratis
                </button>
                <div class="enlace-secundario">
                    <a href="/pages/autenticacion/iniciar-sesion.html">
                        ¿Ya tienes cuenta? Inicia sesión
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
