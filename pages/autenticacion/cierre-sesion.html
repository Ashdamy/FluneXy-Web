<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Cerrada</title>
    <link rel="stylesheet" href="/assets/css/global.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
    <main class="contenedor-autenticacion">
        <section class="tarjeta-formulario">
         <div class="icono-formulario icono-cierre">
              <i class="ph ph-check"></i>
         </div>
          <header class="encabezado-autenticacion">
            <h1>Sesión cerrada</h1>
            <p>
                Tu sesión se cerró correctamente.
            </p>
            <p>
                Tu información financiera está protegida.
            </p>
          </header>
          <div class="mensaje-verificacion">
                            <i class="ph ph-lock"></i>
                            <p>
                                Ningún dato quedó expuesto. Siempre iniciamos sesión con verificación segura.
                            </p>
            </div>
            <button
                type="button"
                class="boton-primario"
                onclick="location.href='iniciar-sesion.html';">
                Iniciar sesión de nuevo
            </button>

        </section>

    </main>
</body>
</html>
